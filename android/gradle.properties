# Sized for ~8GB host RAM (larger heaps can OOM-kill the Gradle daemon).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=false
kotlin.incremental=false
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
# Keep legacy AGP DSL + KGP until full built-in Kotlin migration (Flutter 3.47).
android.newDsl=false
android.builtInKotlin=false
